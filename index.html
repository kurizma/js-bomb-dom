<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Bomberman DOM</title>
    <style>
        #game-grid {
        display: grid;
        grid-template-rows: repeat(13, 40px);
        grid-template-columns: repeat(15, 40px);
        gap: 2px;
        background: #222;
        margin: 20px auto;
        width: fit-content;
        }
        .cell {
        width: 40px;
        height: 40px;
        background: #333;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        transition: background 0.2s;
        }
        .wall      { background: #888; }
        .softWall  { background: #c8a060; }
        .player    { background: #fff; border-radius: 50%; }
        .bomb      { background: #222; color: #fff; }
        .explosion { background: orange; }
    </style>
    </head>
    <body>
        <h2 style="text-align:center;">Bomberman DOM Starter</h2>
        <div id="game-grid"></div>
        <script src="./app.js"></script>
    </body>
</html>
